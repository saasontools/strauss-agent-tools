# plugins/* are intentionally NOT workspace packages: they are plain manifest +
# markdown directories consumed as-is by agent clients, with no install-time build.
packages:
  - "packages/*"
  # apps/* are private, never-published workspace projects — the documentation
  # site lives here rather than under packages/ so `nx release` (projects:
  # packages/*) and npm publishing cannot reach it.
  - "apps/*"
# An optional peer dependency has to stay optional. With this on, pnpm resolves
# @saasontools/strauss-kb's optional search backend and drags native SQLite,
# a llama runtime, and four tree-sitter grammars into every install — including
# CI, which then has to answer the build-script policy below for each of them.
# The package is written to degrade gracefully when that backend is absent, and
# absent is the state this workspace installs in.
autoInstallPeers: false
# Build-script policy: pnpm 11 fails a cold install (CI) when a dependency's
# build script is neither allowed nor denied, so every script-carrying dep
# must be listed here explicitly.
allowBuilds:
  "@google/genai": false
  nx: true
  protobufjs: false
  esbuild: true
  unrs-resolver: true
  # core-js (transitive under Docusaurus/babel) only prints a funding notice
  # from its postinstall — nothing is compiled, so skipping it changes nothing
  # about the built site.
  core-js: false
# The Claude Agent SDK ships the Claude Code binary as a per-platform optional
# dependency — ~245 MB, installed on every machine and in every CI run, and a
# second copy of a CLI the user already has. @saasontools/codex-claude-agent
# points the SDK at the installed `claude` instead (see its claude-binary.ts),
# so none of these are ever spawned. Consumers get the same result with
# `npm install --omit=optional` / `npx --omit=optional`.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl"
  - "@anthropic-ai/claude-agent-sdk-linux-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64"
  - "@anthropic-ai/claude-agent-sdk-win32-x64"
overrides:
  # CVE mitigation: four fast-uri advisories (host confusion, SSRF via IPv6 and
  # percent-decoding) below 3.1.6, transitive via ajv under nx, vite and
  # commitlint. Pinned to the 3.x patch line ajv expects; 4.x is a major.
  "fast-uri@<3.1.6": "3.1.6"
  # CVE mitigation: DoS in brace-expansion <5.0.9 (transitive via nx/minimatch).
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
  # CVE mitigation, both transitive via @opentelemetry/sdk-node under
  # @saasontools/codex-claude-agent. The OTel release train pins these two well
  # behind their own patched lines, so waiting for the exporters to catch up
  # means shipping known-vulnerable versions — protobufjs at a high severity —
  # in the meantime.
  "protobufjs@>=8.0.0 <8.6.6": "8.6.6"
  "@opentelemetry/propagator-jaeger@<2.9.0": "2.9.0"
  # CVE mitigation, both transitive via copy-webpack-plugin and
  # terser-webpack-plugin under Docusaurus: RCE below 7.0.3, and a DoS below
  # 7.0.5 — so the selector covers the higher of the two rather than only the
  # first one found. Those plugins only ever hand it plain build metadata, but
  # the patched line is a major bump they have not taken yet, and the API they
  # use is unchanged across it.
  "serialize-javascript@<7.0.5": "7.1.1"
audit:
  # image-size has no patched release: both advisories say "patched versions:
  # none", and 2.0.2 is still the latest on npm. It reaches this workspace only
  # through @docusaurus/mdx-loader, which calls it at build time on images
  # committed to this repository — there is no attacker-supplied JXL, HEIF, or
  # ICNS in that path. Revisit when image-size ships a fix; the docs site build
  # is the only consumer.
  #
  # `audit.ignore`, not the older `auditConfig.ignoreGhsas`: pnpm renamed the
  # setting in 11.16, and the old spelling stops being read in pnpm 12 — where
  # it would silently stop applying rather than fail, which is the worst way for
  # a security exception to expire.
  ignore:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
