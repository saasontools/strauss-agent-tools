# plugins/* are intentionally NOT workspace packages: they are plain manifest +
# markdown directories consumed as-is by agent clients, with no install-time build.
packages:
  - "packages/*"
# An optional peer dependency has to stay optional. With this on, pnpm resolves
# @saasontools/strauss-kb's optional search backend and drags native SQLite,
# a llama runtime, and four tree-sitter grammars into every install — including
# CI, which then has to answer the build-script policy below for each of them.
# The package is written to degrade gracefully when that backend is absent, and
# absent is the state this workspace installs in.
autoInstallPeers: false
# Build-script policy: pnpm 11 fails a cold install (CI) when a dependency's
# build script is neither allowed nor denied, so every script-carrying dep
# must be listed here explicitly.
allowBuilds:
  "@google/genai": false
  nx: true
  protobufjs: false
  esbuild: true
  unrs-resolver: true
overrides:
  # CVE mitigation: DoS in brace-expansion <5.0.9 (transitive via nx/minimatch).
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
  # CVE mitigation, both transitive via @opentelemetry/sdk-node under
  # @saasontools/codex-claude-agent. The OTel release train pins these two well
  # behind their own patched lines, so waiting for the exporters to catch up
  # means shipping known-vulnerable versions — protobufjs at a high severity —
  # in the meantime.
  "protobufjs@>=8.0.0 <8.6.6": "8.6.6"
  "@opentelemetry/propagator-jaeger@<2.9.0": "2.9.0"
