name: Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/strauss-kb-docs/**"
      - ".github/workflows/docs.yml"
      # A dependency or Node bump changes the built site without touching the
      # app directory, so the deploy has to follow them too or the published
      # site drifts from what CI actually builds.
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
  workflow_dispatch:

permissions: {}

# One deployment at a time, and never cancel one mid-flight: a cancelled Pages
# deployment leaves the site on whatever was published before it, which is fine,
# but a cancelled *upload* wastes the run for no benefit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # Read-only. Nothing in this job touches the Pages API: the site's url and
    # baseUrl are hardcoded in docusaurus.config.ts rather than read from
    # configure-pages' outputs, deliberately — the published URL is part of the
    # site's own configuration and `docusaurus build` must produce identical
    # output whether it runs here or on a laptop.
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx build strauss-kb-docs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/strauss-kb-docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # create the Pages deployment
      id-token: write # let Pages verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Pages must be enabled once by hand before the first deploy: Settings →
      # Pages → Source: GitHub Actions. `enablement: true` is deliberately not
      # used — the action's own docs say it needs a token carrying
      # `administration:write`, which GITHUB_TOKEN cannot be granted, so it
      # would be a step that can only ever fail.
      #
      # configure-pages itself still runs, so the deployment resolves the
      # repository's Pages settings before deploy-pages publishes into them.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # No checkout: this job deploys the artifact the build job uploaded and
      # never reads the repository.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
