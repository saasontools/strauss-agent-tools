name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, test, build (affected)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Derive affected base and head
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: main

      - run: pnpm nx affected -t lint typecheck build

      - run: pnpm nx affected -t test -- --coverage

      - name: Check plugin/package version drift
        run: node scripts/check-plugin-package-drift.mjs
        env:
          NX_BASE: ${{ env.NX_BASE }}

      - name: Validate agent plugins
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g @anthropic-ai/claude-code
          pnpm nx run-many -t validate
          claude plugin validate .

      - run: pnpm audit --audit-level=high

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: packages/*/coverage
          if-no-files-found: ignore

  build-cross-platform:
    # MCP servers run on user machines; path handling is where they break.
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      # step-security/harden-runner supports only Linux runners, so it is
      # intentionally absent from this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nx-set-shas walks history to find the last successful main build,
          # so this job needs the full log the same way `checks` does.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Derive affected base and head
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: main

      # Affected rather than run-many: a commit that only edits documentation
      # under `packages/*` touches no project at all, so this matrix costs two
      # runner startups instead of two full Windows and macOS builds. The job
      # still reports its own status, so it stays a usable required check —
      # unlike a `paths:`-filtered workflow, which never reports at all and
      # leaves the check pending forever.
      #
      # strauss-kb-docs is excluded because this job exists for one reason:
      # MCP servers run on user machines and path handling is where they
      # break. The Docusaurus site ships to GitHub Pages from one Linux
      # runner, so building it on Windows and macOS proves nothing — and
      # unlike the packages, its markdown IS source, so without this exclude
      # every prose edit to the docs would drag two extra `docusaurus build`
      # runs along with it. The site is still built and deployed by docs.yml.
      - run: pnpm nx affected -t build test --exclude strauss-kb-docs
