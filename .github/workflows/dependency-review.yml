name: Dependency review

on:
  pull_request:

permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # image-size has no patched release — both advisories say "patched
          # versions: none", and 2.0.2 is still latest on npm. It reaches this
          # repository only through @docusaurus/mdx-loader, which calls it at
          # docs-build time on images committed here, so no attacker-supplied
          # JXL, HEIF, or ICNS ever reaches the parsers. Mirrored by
          # auditConfig.ignoreGhsas in pnpm-workspace.yaml; drop both when a fix
          # ships.
          allow-ghsas: GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
